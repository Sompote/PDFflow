[package]
name = "pdfflow"
version = "0.1.3"
edition = "2024"
description = "A small PDF editor with a Photoshop-style UI"
license = "AGPL-3.0-or-later"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "x11", "wayland"] }
hayro = "0.7"
lopdf = { version = "0.38", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
skrifa = "0.44"
harfrust = "0.12"
flate2 = "1"
# Glyph geometry from hayro's interpreter (the version hayro itself uses).
kurbo = "0.13"
# The MCP server (JSON-RPC) and its PNG image results.
serde_json = "1"
base64 = "0.22"
# The event loop is built here (not inside eframe) so macOS "open document" events can be hooked.
winit = { version = "0.30", default-features = false }
# Digital signatures (pure Rust, one RustCrypto generation: der 0.7)
cms = { version = "0.2", features = ["builder"] }
x509-cert = { version = "0.2", features = ["builder", "pem"] }
p12-keystore = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10"
der = "0.7"
spki = "0.7"
pkcs8 = "0.10"
const-oid = { version = "0.9", features = ["db"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
