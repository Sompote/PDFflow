[package]
name = "th-llm"
version = "0.1.8"
edition = "2021"
license = "MIT"
description = "TellusHive's OpenAI-compatible chat client (vendored from github.com/Sompote/TellusHive, MIT): DeepSeek, OpenRouter, Ollama, OpenAI, vLLM, Claude Code / Codex presets"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
base64 = "0.22"
