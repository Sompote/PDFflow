[package]
name = "th-hive"
version = "0.1.8"
edition = "2021"
license = "MIT"
description = "TellusHive's agent harness (vendored from github.com/Sompote/TellusHive, MIT): plugin context, session log, turn/step agent loop, tool pipeline, subagents, compaction"

[dependencies]
